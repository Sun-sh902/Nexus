name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck and ESLint
        run: |
          pnpm typecheck
          pnpm exec eslint src tests scripts

      - name: Frontend unit and contract tests
        run: pnpm test

      - name: Production frontend build
        run: pnpm build

      - name: Rust formatting check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy lints
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit and scenario tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Playwright UI and accessibility suite (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pnpm exec playwright install chrome
          pnpm test:ui
